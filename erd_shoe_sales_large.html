
<style>
#erd { padding: 8px 0; overflow-x: auto; }
#erd svg { min-width: 1400px; font-size: 15px !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  er: { diagramPadding: 40, layoutDirection: 'LR', minEntityWidth: 200, minEntityHeight: 40, entityPadding: 20, useMaxWidth: false },
  themeVariables: {
    darkMode: dark,
    fontSize: '15px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2840' : '#eeedfe',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#1a3a2e' : '#e1f5ee',
    secondaryBorderColor: dark ? '#0F6E56' : '#0F6E56',
    tertiaryColor: dark ? '#3a1e14' : '#faece7',
    tertiaryBorderColor: dark ? '#993C1D' : '#993C1D',
  },
});

const diagram = `erDiagram
  nguoi_dung {

    string email
    string mat_khau_hash
    string ho_ten
    string so_dien_thoai
    text dia_chi
    string vai_tro
    text anh_dai_dien
    bool dang_hoat_dong
    datetime ngay_tao
    datetime ngay_cap_nhat
  }

  dia_chi_giao_hang {
    int id PK
    int id_nguoi_dung FK
    string ten_nguoi_nhan
    string so_dien_thoai
    text dia_chi
    bool la_mac_dinh
  }

  danh_muc {
    int id PK
    string ten
    string slug
    text mo_ta
    text anh
    int id_cha FK
    bool dang_hoat_dong
    datetime ngay_tao
    datetime ngay_cap_nhat
  }

  san_pham {
    int id PK
    string ten
    string slug
    text mo_ta
    string mo_ta_ngan
    float gia
    float gia_khuyen_mai
    int so_luong_ton
    string ma_sku
    int id_danh_muc FK
    string thuong_hieu

    bool la_noi_bat
    string cac_kich_thuoc

  anh_san_pham {

  don_hang {
    int id PK
    int id_nguoi_dung FK
    string ma_don_hang
    float tong_tien
    float tien_giam_gia
    float phi_van_chuyen
    float thanh_tien
    string trang_thai
    string phuong_thuc_thanh_toan
    string trang_thai_thanh_toan
    string ten_nguoi_nhan
    string sdt_nguoi_nhan
    text dia_chi_nhan
    text ghi_chu
    datetime ngay_tao
    datetime ngay_cap_nhat
  }

  chi_tiet_don_hang {
    int id PK
    int id_don_hang FK
    int id_san_pham FK
    string kich_thuoc
    int so_luong
    float don_gia
    float thanh_tien
  }

  gio_hang {
    int id PK
    int id_nguoi_dung FK

  }

  ma_giam_gia {

  phuong_thuc_thanh_toan {

  }

  nhat_ky {

  thong_tin_ngan_hang {

  nguoi_dung ||--o{ danh_gia : "viet"
  nguoi_dung ||--o{ su_dung_ma_giam_gia : "su dung"
  nguoi_dung ||--o{ nhat_ky : "tao ra"

  danh_muc ||--o{ san_pham : "chua"
  danh_muc ||--o{ danh_muc : "cha-con"

  san_pham ||--o{ anh_san_pham : "co"
  san_pham ||--o{ chi_tiet_don_hang : "xuat hien"
  san_pham ||--o{ gio_hang : "trong"
  san_pham ||--o{ danh_sach_yeu_thich : "duoc yeu thich"
  san_pham ||--o{ danh_gia : "nhan duoc"

  don_hang ||--o{ chi_tiet_don_hang : "gom"

  ma_giam_gia ||--o{ su_dung_ma_giam_gia : "duoc dung"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
